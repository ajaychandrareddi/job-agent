[project]
name = "job-agent"
version = "0.1.0"
description = "Agentic job search, matching and application workflow (LangGraph + LangChain)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "apscheduler>=3.10,<4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "pyjwt[crypto]>=2.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
vertex = ["langchain-google-vertexai>=2.0"]
anthropic = ["langchain-anthropic>=0.2"]
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fpdf2>=2.7",
    "opentelemetry-sdk>=1.27",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a PostgreSQL database (TEST_DATABASE_URL)",
]
filterwarnings = [
    "error::pydantic.PydanticDeprecatedSince20",
    # Deprecations triggered by our own code fail the suite (caught by the phase gate).
    "error::DeprecationWarning:job_agent.*",
]

[tool.coverage.run]
source = ["src/job_agent"]
branch = true
# Entry-point shims only call a tested main(); covered by tests of that function.
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Provider SDKs are optional extras.
module = ["langchain_openai.*", "langchain_google_vertexai.*", "langchain_anthropic.*",
          "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["job_agent.llm.factory"]
warn_return_any = false
